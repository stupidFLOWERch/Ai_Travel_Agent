services:
  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: travel-mcp-server

    # Run the existing server object over Streamable HTTP without changing Python code.
    command: ["fastmcp", "run", "mcp_server.py:mcp", "--transport", "http", "--host", "0.0.0.0", "--port", "8000"]

    env_file:
      - .env

    ports:
      - "8000:8000"

  chainlit-ui:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: travel-chainlit-ui
    command: ["chainlit", "run", "app.py", "--host", "0.0.0.0", "--port", "8080"]

    env_file:
      - .env

    depends_on:
      - mcp-server

    ports:
      - "8080:8080"

